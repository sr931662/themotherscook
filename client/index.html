<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Progressive enhancement gate: the fade-up-on-scroll CSS only hides
      // content when JS is confirmed to be running, so a no-JS visitor
      // always sees full content instead of permanently opacity:0 sections.
      document.documentElement.classList.add('js')
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>The Mothers Cook | Premium Vegetarian Bulk Catering in Delhi, Noida &amp; NCR</title>

      name="description"
      content="Home-style vegetarian bulk catering for weddings, poojas, corporate events and family gatherings across Delhi, Noida and NCR. Cooked fresh, delivered sealed."
    />
    <link rel="canonical" href="https://www.themotherscook.example/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Mothers Cook" />
    <meta
      property="og:title"

    <meta property="og:url" content="https://www.themotherscook.example/" />

    <meta name="twitter:card" content="summary_large_image" />
